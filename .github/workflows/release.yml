name: Release

on:
  push:
    tags: ["v*"]

# Only this workflow uses macOS runners, and only on a version tag: the darwin
# targets cannot be cross-compiled from Linux without the Apple SDK. One macOS
# job produces both darwin artifacts.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The keyring crate's Linux backend (libdbus-sys) needs the system D-Bus
      # library to compile. macOS uses a native backend and needs nothing.
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Asset naming is the contract `self-update` resolves against:
      # <bin>-<target>.tar.gz and a matching .sha256.
      - name: Package
        run: |
          set -euo pipefail
          BIN=kin
          NAME="$BIN-${{ matrix.target }}"
          tar -czf "$NAME.tar.gz" -C "target/${{ matrix.target }}/release" "$BIN"
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes ./*.tar.gz ./*.tar.gz.sha256
